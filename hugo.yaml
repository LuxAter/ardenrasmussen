baseURL: https://ardenrasmussen.com/
locale: en-us
title: Arden Rasmussen
theme: [hugo-admonitions, PaperMod]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

outputs:
  home:
    - HTML
    - JSON

minify:
  disableXML: true
  minifyOutput: true

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
            - - '\['
              - '\]'
            - - $$
              - $$
          inline:
            - - '\('
              - '\)'
            - - "$"
              - "$"
        enable: true

pagination:
  pagerSize: 10

ignoreFiles:
  - ".webm$"

menu:
  main:
    - name: Projects
      url: projects/
      weight: 10
    - name: Search
      url: search/
      weight: 10

params:
  math: true
  env: production
  description: "Arden Rasmussen's Personal Portfolio"
  defaultTheme: auto

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true

  profileMode:
    enabled: true
    subtitle: Software Developer Engineer
    imageUrl: images/self.jpg # optional
    imageWidth: 240 # custom size
    imageHeight: 240 # custom size
    buttons:
      - name: Projects
        url: /projects

  socialIcons: # optional
    - name: Github
      url: https://github.com/Nedra1998
    - name: LinkedIn
      url: https://www.linkedin.com/in/arden-rasmussen-864929160/
    - name: cv
      url: https://google.com
